
name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    name: Verificar backend
    runs-on: ubuntu-latest

    steps:
      # Descargar el repositorio completo
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Configurar Java 21
      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compilar y ejecutar pruebas
      - name: Verify
        run: chmod +x mvnw && ./mvnw -B verify

      # Análisis de SonarQube Cloud
      - name: SonarQube Cloud Scan
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Publicar imagen Docker en GitHub Container Registry
  publish-image:
    name: Publicar imagen en GHCR
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/preproduccion'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Descargar código
      - name: Descargar código
        uses: actions/checkout@v5

      # Configurar Docker Buildx
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Iniciar sesión en GHCR
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Construir y publicar imagen Docker
      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/jeisonrv/serenity-backend:preproduccion
            ghcr.io/jeisonrv/serenity-backend:${{ github.sha }}
