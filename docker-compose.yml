
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-serenity_db}
      POSTGRES_USER: ${DB_USER:-serenity_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
        - "127.0.0.1:55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - serenity-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: serenity-backend:1.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-serenity_db}
      DB_USER: ${DB_USER:-serenity_user}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}

      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      JWT_EXPIRATION: "86400000"

      CORS_ORIGINS: ${CORS_ORIGINS:-https://serenitybienestar.site,https://www.serenitybienestar.site}
      PORT: "8081"
      SPRING_PROFILES_ACTIVE: prod

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-TU_CLIENT_ID}

      EMAIL_ENABLED: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:?Define RESEND_API_KEY en .env}
      RESEND_FROM: ${RESEND_FROM:-Serenity <notificaciones@serenitybienestar.site>}

      FRASES_API_URL: https://cdn.jsdelivr.net/gh/GomezMig03/MotivationalAPI

      PRIVACY_VERSION: "1.0"
      TERMS_VERSION: "1.0"
      REMINDERS_ZONE: America/Bogota
      REPORTES_PROCEDENTES_RESTRICCION: "3"

      DB_POOL_CONNECTION_TIMEOUT_MS: "30000"
      DB_POOL_MAX_SIZE: "30"
      DB_POOL_MIN_IDLE: "10"

      APP_LOGGING_DATABASE_ENABLED: "true"
      APP_LOGGING_DATABASE_MINIMUM_LEVEL: WARN
      APP_LOGGING_DATABASE_BATCH_SIZE: "100"
      APP_LOGGING_DATABASE_FLUSH_INTERVAL_MS: "2000"
      APP_LOGGING_DATABASE_MAX_MESSAGE_LENGTH: "10000"
      APP_LOGGING_DATABASE_MAX_STACK_TRACE_LENGTH: "50000"
      APP_LOGGING_DATABASE_MAX_RETRIES: "3"
      APP_LOGGING_DATABASE_QUEUE_CAPACITY: "10000"
      APP_LOGGING_DATABASE_CLEANUP_ENABLED: "false"
      APP_LOGGING_DATABASE_CLEANUP_RETENTION_DAYS: "30"
      APP_LOGGING_DATABASE_SHUTDOWN_WAIT_MS: "5000"

      TOMCAT_THREADS_MAX: "200"
      TOMCAT_ACCEPT_COUNT: "100"

    ports:
      - "8081:8081"

    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8081/actuator/health >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

    restart: unless-stopped
    networks:
      - serenity-net

  frontend:
    build:
      context: ../frontend-serenity
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: /api
      WS_URL: /ws
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-TU_CLIENT_ID}
    restart: unless-stopped
    networks:
      - serenity-net

  caddy:
    image: caddy:2.11.9-alpine
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - serenity-net

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  serenity-net:
    driver: bridge
