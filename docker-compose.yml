services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-serenity_db}
      POSTGRES_USER: ${DB_USER:?Falta DB_USER en .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - serenity-net
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: serenity-backend:1.0.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: test
      PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-serenity_db}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:8080,http://localhost:4200}
      TERMS_VERSION: ${TERMS_VERSION:-1.0}
      PRIVACY_VERSION: ${PRIVACY_VERSION:-1.0}
      REPORTES_PROCEDENTES_RESTRICCION: ${REPORTES_PROCEDENTES_RESTRICCION:-3}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REMINDERS_ZONE: ${REMINDERS_ZONE:-America/Bogota}
      FRASES_API_URL: ${FRASES_API_URL:-https://cdn.jsdelivr.net/gh/GomezMig03/MotivationalAPI}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-30}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-10}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-30000}
      TOMCAT_THREADS_MAX: ${TOMCAT_THREADS_MAX:-200}
      TOMCAT_ACCEPT_COUNT: ${TOMCAT_ACCEPT_COUNT:-100}
      APP_LOGGING_DATABASE_ENABLED: ${APP_LOGGING_DATABASE_ENABLED:-true}
      APP_LOGGING_DATABASE_MINIMUM_LEVEL: ${APP_LOGGING_DATABASE_MINIMUM_LEVEL:-WARN}
      APP_LOGGING_DATABASE_BATCH_SIZE: ${APP_LOGGING_DATABASE_BATCH_SIZE:-100}
      APP_LOGGING_DATABASE_FLUSH_INTERVAL_MS: ${APP_LOGGING_DATABASE_FLUSH_INTERVAL_MS:-2000}
      APP_LOGGING_DATABASE_QUEUE_CAPACITY: ${APP_LOGGING_DATABASE_QUEUE_CAPACITY:-10000}
      APP_LOGGING_DATABASE_MAX_MESSAGE_LENGTH: ${APP_LOGGING_DATABASE_MAX_MESSAGE_LENGTH:-10000}
      APP_LOGGING_DATABASE_MAX_STACK_TRACE_LENGTH: ${APP_LOGGING_DATABASE_MAX_STACK_TRACE_LENGTH:-50000}
      APP_LOGGING_DATABASE_MAX_RETRIES: ${APP_LOGGING_DATABASE_MAX_RETRIES:-3}
      APP_LOGGING_DATABASE_SHUTDOWN_WAIT_MS: ${APP_LOGGING_DATABASE_SHUTDOWN_WAIT_MS:-5000}
      APP_LOGGING_DATABASE_CLEANUP_ENABLED: ${APP_LOGGING_DATABASE_CLEANUP_ENABLED:-false}
      APP_LOGGING_DATABASE_CLEANUP_RETENTION_DAYS: ${APP_LOGGING_DATABASE_CLEANUP_RETENTION_DAYS:-30}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8081/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - serenity-net
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend-serenity
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_URL: /api
      WS_URL: /ws
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "80:8080"
    networks:
      - serenity-net
    restart: unless-stopped

networks:
  serenity-net:
    driver: bridge

volumes:
  db_data:
