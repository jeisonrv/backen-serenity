services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER} -d $${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serenity-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: serenity-backend:1.0.0
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PORT: ${PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
    ports:
      - "${PORT}:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - serenity-net

  frontend:
    build:
      context: ../frontend-serenity
      dockerfile: Dockerfile
    image: serenity-frontend:1.0.0
    restart: unless-stopped
    environment:
      API_URL: ${API_URL}
      WS_URL: ${WS_URL}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - serenity-net

networks:
  serenity-net:
    driver: bridge

volumes:
  db_data: