spring.application.name=serenity
spring.mvc.problemdetails.enabled=true

# PostgreSQL y JPA
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Increment terms.version when the mandatory terms or privacy notice changes.
# Increment privacy.version when the sensitive-data authorization changes.
terms.version=${TERMS_VERSION:1.0}
privacy.version=${PRIVACY_VERSION:1.0}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT y CORS
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=${PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.logging.database.enabled=${APP_LOGGING_DATABASE_ENABLED:true}
app.logging.database.minimum-level=${APP_LOGGING_DATABASE_MINIMUM_LEVEL:WARN}
app.logging.database.batch-size=${APP_LOGGING_DATABASE_BATCH_SIZE:100}
app.logging.database.flush-interval-ms=${APP_LOGGING_DATABASE_FLUSH_INTERVAL_MS:2000}
app.logging.database.queue-capacity=${APP_LOGGING_DATABASE_QUEUE_CAPACITY:10000}
app.logging.database.max-message-length=${APP_LOGGING_DATABASE_MAX_MESSAGE_LENGTH:10000}
app.logging.database.max-stack-trace-length=${APP_LOGGING_DATABASE_MAX_STACK_TRACE_LENGTH:50000}
app.logging.database.max-retries=${APP_LOGGING_DATABASE_MAX_RETRIES:3}
app.logging.database.shutdown-wait-ms=${APP_LOGGING_DATABASE_SHUTDOWN_WAIT_MS:5000}
app.logging.database.cleanup.enabled=${APP_LOGGING_DATABASE_CLEANUP_ENABLED:false}
app.logging.database.cleanup.retention-days=${APP_LOGGING_DATABASE_CLEANUP_RETENTION_DAYS:30}
app.moderacion.reportes-procedentes-para-restringir=${REPORTES_PROCEDENTES_RESTRICCION:3}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
app.correo.habilitado=${EMAIL_ENABLED:false}
app.correo.resend.api-key=${RESEND_API_KEY:}
# Configuración de Resend

# Recordatorios diarios: 6:00 p. m., hora de Colombia
app.correo.recordatorios.cron=0 0 18 * * *
app.correo.recordatorios.zona=${REMINDERS_ZONE:America/Bogota}

# Frase motivacional diaria
app.frases.api-url=${FRASES_API_URL:https://cdn.jsdelivr.net/gh/GomezMig03/MotivationalAPI}
