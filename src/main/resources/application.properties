spring.application.name=serenity
spring.mvc.problemdetails.enabled=true

# PostgreSQL y JPA
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT y CORS
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

server.port=${PORT:8081}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.moderacion.reportes-procedentes-para-restringir=${REPORTES_PROCEDENTES_RESTRICCION:3}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
app.correo.habilitado=${EMAIL_ENABLED:false}
app.correo.resend.api-key=${RESEND_API_KEY:}
app.correo.resend.remitente=${RESEND_FROM:}
